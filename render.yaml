# Render Blueprint — build/deploy runner (NOT the host)
# Firebase Hosting remains the frontend URL/domain. Supabase remains the backend.
# Render builds the Vite app and deploys it to Firebase Hosting on every push.
services:
  - type: web
    name: matchforge-deployer
    runtime: node
    branch: main
    autoDeploy: true
    plan: free
    buildCommand: npm ci && npm run build
    # Deploy the built app to Firebase Hosting, then keep a tiny health endpoint
    # alive so Render's free web service stays healthy (it does NOT serve the app).
    startCommand: npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN" && node -e "const http=require('http');http.createServer((req,res)=>{res.writeHead(200,{'Content-Type':'text/plain'});res.end('ok')}).listen(process.env.PORT||10000)"
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: FIREBASE_TOKEN
        sync: false
