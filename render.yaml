# Render Blueprint — static frontend (Vite/React)
# Backend remains Supabase; set VITE_* env vars in the Render dashboard.
services:
  - type: web
    name: scoreboardrobotics
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA routing: send all paths to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Cache hashed assets aggressively; never cache index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    # Set these in the Render dashboard (sync: false => prompted on first deploy)
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
