project_id = "matchforge"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "https://roboticscoreboard.web.app"
additional_redirect_urls = ["http://localhost:5173", "https://roboticscoreboard.web.app", "https://roboticscoreboard.web.app/**", "https://roboticscoreboard.firebaseapp.com", "https://roboticscoreboard.firebaseapp.com/**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.match-action]
verify_jwt = false

[functions.controller-session]
verify_jwt = false

[functions.create-share-link]
verify_jwt = false

[functions.username-auth]
verify_jwt = false
